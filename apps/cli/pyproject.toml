[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewgraph"
version = "2.3.11"
description = "ReviewGraph command line application"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "reviewgraph-engine==2.3.11",
]

[project.urls]
Homepage = "https://github.com/borg0ai/dx-reviewgraph"
Repository = "https://github.com/borg0ai/dx-reviewgraph"
Documentation = "https://github.com/borg0ai/dx-reviewgraph/blob/main/docs/INDEX.md"
Issues = "https://github.com/borg0ai/dx-reviewgraph/issues"

[project.scripts]
reviewgraph = "reviewgraph.cli:main"
reviewgraph-daemon = "reviewgraph.daemon_cli:main"

[project.optional-dependencies]
all = ["reviewgraph-engine[all]"]
eval = ["reviewgraph-engine[eval]"]
google-embeddings = ["reviewgraph-engine[google-embeddings]"]
embeddings = ["reviewgraph-engine[embeddings]"]
communities = ["reviewgraph-engine[communities]"]
enrichment = ["reviewgraph-engine[enrichment]"]
wiki = ["reviewgraph-engine[wiki]"]
browser-test = ["playwright>=1.45,<2", "pytest-playwright>=0.5,<1"]
dev = [
    "mypy>=1.10,<3",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=4.0,<8",
    "ruff>=0.3.0,<1",
    "types-networkx",
]

[tool.hatch.build.targets.wheel]
packages = ["reviewgraph"]

[tool.hatch.build.targets.sdist]
include = ["reviewgraph/", "README.md", "pyproject.toml"]

[tool.uv.sources]
reviewgraph-engine = { workspace = true }
