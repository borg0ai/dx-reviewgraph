[project]
name = "reviewgraph-workspace"
version = "2.3.9"
requires-python = ">=3.10"
dependencies = ["reviewgraph==2.3.9"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["modules/code-review", "apps/cli"]

[tool.uv.sources]
code-review-engine = { workspace = true }
reviewgraph = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.10,<3",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=4.0,<8",
    "ruff>=0.3.0,<1",
    "types-networkx",
]
browser-test = ["playwright>=1.45,<2", "pytest-playwright>=0.5,<1"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "diagrams/",
    "tests/fixtures/sample_databricks_notebook.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"modules/code-review/graph_engine/visualization.py" = ["E501"]
"modules/code-review/graph_engine/_legacy_instructions.py" = ["E501"]
"tests/fixtures/sample_databricks_export.py" = ["F841", "W292"]
"tests/fixtures/sample_notebook.ipynb" = ["F401", "I001"]
"tests/test_multilang.py" = ["E501"]

[tool.bandit]
skips = ["B101", "B404", "B603", "B607", "B608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
    "e2e: end-to-end tests that drive the real pipeline, MCP server or CLI as a subprocess",
    "browser: drives the generated visualization page in a real headless browser",
    "action_e2e: drives the composite GitHub Action's own steps against scratch repositories",
    "platform_lifecycle: drives install/reinstall/uninstall for every supported platform",
    "packaging: builds the distributions and smoke-tests clean installs",
    "determinism: rebuilds one corpus many ways and compares every table (minutes)",
    "upgrade: installs released versions from PyPI and upgrades graph data",
    "surface: drives every registered MCP tool and prompt through a real client over stdio",
    "corpus: builds the graph over pinned real repositories and compares recorded baselines",
    "exports: slow conformance checks for every artifact the tool writes",
    "cli_surface: enumerates the whole CLI and its failure modes as subprocesses (slow)",
    "concurrency: cross-process database contention, interrupted builds, daemon lifecycle and watcher stress (opt-in, slow)",
]
