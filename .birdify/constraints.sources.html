语义核验，不代表代码有误。"},"reference":{"body":"# 引用规范\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-a54ff182c7e8acf5":{"body":"# AGENTS.md\n\n范围：.\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Agent Instructions\n\nProject context (architecture, commands, conventions, tests) is in `CLAUDE.md`. This file holds the rules for every coding agent working in this repository.\n\n## Non-Interactive Shell Commands\n\n`cp`, `mv` and `rm` may be aliased with `-i` on some systems, which leaves an agent waiting for a y/n answer that never comes. Always pass the non-interactive flag:\n\n```bash\ncp -f source dest\nmv -f source dest\nrm -f file\nrm -rf directory\ncp -rf source dest\n```\n\nOther commands that may prompt: `scp` and `ssh` (`-o BatchMode=yes`), `apt-get` (`-y`), `brew` (`HOMEBREW_NO_AUTO_UPDATE=1`).\n\n## IssueGraph issue tracking\n\nThis project uses IssueGraph. Run `issuegraph prime` for current workflow and command guidance.\n\n```bash\nissuegraph ready\nissuegraph show \u003cid>\nissuegraph update \u003cid> --claim\nissuegraph close \u003cid>\nissuegraph remember \"insight\"\n```\n\n- Use IssueGraph for task tracking. Do not create Markdown TODO lists.\n- IssueGraph stores the local database under `.issuegraph/` and tracks `issues.jsonl` plus `manifest.json` in Git.\n- Do not create branches, commit, push, merge, or sync IssueGraph remotes unless the user explicitly asks. When asked for a PR, target `main`.\n- Before handoff, run relevant quality checks and report changed files and validation results.\n\n\u003c!-- reviewgraph MCP tools -->\n## MCP Tools: reviewgraph\n\n**This project has a knowledge graph. Start with the reviewgraph\nMCP tools to narrow scope, then read the source.** The graph is cheaper than scanning files and\ngives you structural context (callers, dependents, test coverage) that file search cannot.\n\n### When to use graph tools FIRST\n\n- **Exploring code**: `semantic_search_nodes_tool` or `query_graph_tool` instead of Grep\n- **Understanding impact**: `get_impact_radius_tool` instead of manually tracing imports\n- **Code review**: `detect_changes_tool` + `get_review_context_tool` instead of reading entire files\n- **Finding relationships**: `query_graph_tool` with callers_of/callees_of/imports_of/tests_for\n- **Architecture questions**: `get_architecture_overview_tool` + `list_communities_tool`\n\n### Verify in the source\n\n- Narrow scope with the graph, then read the source. Do not change code from graph output alone.\n- For any non-trivial change, read the implementation and the relevant tests before concluding.\n- Verify the exact source when touching behavior, database logic, migrations, retries, fallbacks,\n  recovery, or compatibility code.\n- When the graph and the source disagree, the source wins. The graph may be stale or may not\n  model that relationship.\n- An empty graph result can mean \"not indexed\" or \"not statically visible\", not \"does not exist\".\n\n### Key Tools\n\n| Tool | Use when |\n| ------ | ---------- |\n| `detect_changes_tool` | Reviewing code changes — gives risk-scored analysis |\n| `get_review_context_tool` | Need source snippets for review — token-efficient |\n| `get_impact_radius_tool` | Understanding blast radius of a change |\n| `get_affected_flows_tool` | Finding which execution paths are impacted |\n| `query_graph_tool` | Tracing callers, callees, imports, tests, dependencies |\n| `semantic_search_nodes_tool` | Finding functions/classes by name or keyword |\n| `get_architecture_overview_tool` | Understanding high-level codebase structure |\n| `refactor_tool` | Planning renames, finding dead code |\n\n### Workflow\n\n1. The graph auto-updates on file changes (via hooks).\n2. Use `detect_changes_tool` for code review.\n3. Use `get_affected_flows_tool` to understand impact.\n4. Use `query_graph_tool` pattern=\"tests_for\" to check coverage.\n\u003c!-- /reviewgraph MCP tools -->"},"source-a54ff182c7e8acf5-s1":{"body":"来源：`AGENTS.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Agent Instructions\n\nProject context (architecture, commands, conventions, tests) is in `CLAUDE.md`. This file holds the rules for every coding agent working in this repository.\n"},"source-a54ff182c7e8acf5-s2":{"body":"来源：`AGENTS.md:5-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Non-Interactive Shell Commands\n\n`cp`, `mv` and `rm` may be aliased with `-i` on some systems, which leaves an agent waiting for a y/n answer that never comes. Always pass the non-interactive flag:\n\n```bash\ncp -f source dest\nmv -f source dest\nrm -f file\nrm -rf directory\ncp -rf source dest\n```\n\nOther commands that may prompt: `scp` and `ssh` (`-o BatchMode=yes`), `apt-get` (`-y`), `brew` (`HOMEBREW_NO_AUTO_UPDATE=1`).\n"},"source-a54ff182c7e8acf5-s3":{"body":"来源：`AGENTS.md:19-36`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## IssueGraph issue tracking\n\nThis project uses IssueGraph. Run `issuegraph prime` for current workflow and command guidance.\n\n```bash\nissuegraph ready\nissuegraph show \u003cid>\nissuegraph update \u003cid> --claim\nissuegraph close \u003cid>\nissuegraph remember \"insight\"\n```\n\n- Use IssueGraph for task tracking. Do not create Markdown TODO lists.\n- IssueGraph stores the local database under `.issuegraph/` and tracks `issues.jsonl` plus `manifest.json` in Git.\n- Do not create branches, commit, push, merge, or sync IssueGraph remotes unless the user explicitly asks. When asked for a PR, target `main`.\n- Before handoff, run relevant quality checks and report changed files and validation results.\n\n\u003c!-- reviewgraph MCP tools -->"},"sourc 原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Key Tools\n\n| Tool | Use when |\n| ------ | ---------- |\n| `detect_changes_tool` | Reviewing code changes — gives risk-scored analysis |\n| `get_review_context_tool` | Need source snippets for review — token-efficient |\n| `get_impact_radius_tool` | Understanding blast radius of a change |\n| `get_affected_flows_tool` | Finding which execution paths are impacted |\n| `query_graph_tool` | Tracing callers, callees, imports, tests, dependencies |\n| `semantic_search_nodes_tool` | Finding functions/classes by name or keyword |\n| `get_architecture_overview_tool` | Understanding high-level codebase structure |\n| `refactor_tool` | Planning renames, finding dead code |\n"},"source-a54ff182c7e8acf5-s8":{"body":"来源：`AGENTS.md:74-80`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Workflow\n\n1. The graph auto-updates on file changes (via hooks).\n2. Use `detect_changes_tool` for code review.\n3. Use `get_affected_flows_tool` to understand impact.\n4. Use `query_graph_tool` pattern=\"tests_for\" to check coverage.\n\u003c!-- /reviewgraph MCP tools -->"},"source-eca12c0a30e25b4b":{"body":"# CONTRIBUTING.md\n\n范围：.\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Contributing to ReviewGraph\n\n## Development Setup\n\n```bash\ngit clone https://github.com/borg0ai/dx-reviewgraph.git\ncd dx-reviewgraph\nuv sync --group dev                  # requires uv\nuv run pytest tests/ --tb=short -q   # check the setup\n```\n\n## Running Tests\n\n```bash\nuv run pytest tests/ --tb=short -q                                                    # all tests\nuv run pytest --cov=graph_engine --cov-report=term-missing --cov-fail-under=65   # with the CI coverage gate\nuv run pytest tests/test_parser.py -v                                                 # one file\n```\n\nCI runs the suite on Python 3.10, 3.11, 3.12 and 3.13 and fails below 65% coverage.\n\n`tests/test_parser_grammar_contract.py` checks every built-in class, function, import,\nand call dispatch name against its bundled Tree-sitter grammar. When updating a grammar\nor adding dispatch entries, use the grammar's actual named node types. This contract\nchecks configured dispatch names; language fixtures still verify extraction behavior.\n\n## Linting and Type Checking\n\n```bash\nuv run ruff check modules/code-review/graph_engine/ apps/cli/reviewgraph/\nuv run mypy modules/code-review/graph_engine/ apps/cli/reviewgraph/ --ignore-missing-imports --no-strict-optional\n```\n\nCI also runs `bandit -r modules/code-review/graph_engine/ -c pyproject.toml`.\n\n## Code Style\n\n- Line length: 100 characters.\n- Target: Python 3.10+.\n- Linter: ruff with rules E, F, I, N, W. Imports are sorted by ruff.\n- SQL: parameterised queries (`?` placeholders) only.\n\n## Making Changes\n\n1. Fork the repository and create a branch from `main`: `git switch -c feature/your-feature origin/main`.\n2. Make the change and add tests for new behaviour.\n3. Run the tests, ruff and mypy as above.\n4. Update docs where behaviour changed (README, `docs/`, docstrings).\n5. Open a pull request against `main`. The template asks for the linked issue, what changed and why, and the commands you ran.\n\n## Branching\n\nCreate a short-lived feature branch from `origin/main` and send every change\nthrough a pull request directly to `main`:\n\n```bash\ngit fetch origin\ngit switch -c feature/your-change origin/main\n```\n\nRun the checks listed in Development Setup, then open a PR against `main`. CI and the\nReviewGraph PR review workflow run on the PR. Merge through GitHub. Tag releases from `main`.\n\nThe optional release gate is separate from routine PR CI. Run\n`.github/workflows/release-gate.yml` manually before a release when slow upgrade,\npackaging, determinism, E2E, corpus and browser checks are needed. It reports to the\nworkflow summary and a `release-gate` issue; it does not open or merge pull requests.\n\n## Project Structure\n\nThe module list is in the Architecture section of `CLAUDE.md`. In outline:\n\n```\napps/cli/pyproject.toml                 # CLI application package and entry points\napps/cli/reviewgraph/               # reviewgraph and reviewgraph-daemon commands\nmodules/code-review/pyproject.toml       # reusable core module package\nmodules/code-review/graph_engine/        # core library, MCP server, tools and eval\nmodules/code-review/skills/             # skills bundled into the core wheel\ntests/                                  # pytest suite and language fixtures\ndocs/                                   # user documentation\n```\n\n## Adding Language Support\n\nIf you only need a language for your own repository, you may not need to change this project: add a `.reviewgraph/languages.toml` that maps extensions and node types to any grammar in tree-sitter-language-pack (see [docs/CUSTOM_LANGUAGES.md](docs/CUSTOM_LANGUAGES.md)). To add built-in support:\n\n1. Add the extension mapping to `EXTENSION_TO_LANGUAGE` in `parser.py`.\n2. Add the tree-sitter node types to `_CLASS_TYPES`, `_FUNCTION_TYPES`, `_IMPORT_TYPES` and `_CALL_TYPES`.\n3. Add a sample file in `tests/fixtures/`.\n4. Add parsing tests in `tests/test_multilang.py`.\n\n## Adding a Platform Target\n\nEvery supported AI tool is permanent maintenance surface: its config path, schema, install merge, uninstall and tests have to keep working on every release. Some existing targets were merged without evidence that they worked in a released client, and those are the ones that break. New targets are held to the bar below.\n\nStart with a platform request issue (https://github.com/borg0ai/dx-reviewgraph/issues/new/choose) so the client can be discussed before anyone writes code. A pull request that adds a platform will not be reviewed until it includes all of the following.\n\n1. A link to the platform's official MCP configuration documentation. Blog posts, forum replies and screenshots of a settings dialog are not enough.\n2. The exact config file path and the exact schema of a server entry: which top-level key holds the servers, whether that value is an object or an array, and whether a `type` field is required.\n3. The entry added through the existing `PLATFORMS` table in `modules/code-review/graph_engine/skills.py`, plus `_PLATFORM_CHOICES` in `apps/cli/reviewgraph/cli.py`. Use the fields already there: `name`, `config_path`, `key`, `detect`, `format`, `needs_type`, and where needed `legacy_keys`, `server_type`, `entry_fields`. If the client needs something the table cannot express, say so in the pull request and explain why, rather than adding a separate code path beside it.\n4. Preservation of unrelated user settings. Install must merge only the `reviewgraph` server entry and leave every other server, key and top-level setting intact. If the file cannot be parsed, install must skip it rather than rewrite it.\n5. A byte-idempotent reinstall. Running install twice must leave the config file and any generated instruction file byte for byte identical.\n6. A working uninstall in `modules/code-review/graph_engine/uninstall.py` that removes only what install added, including any legacy keys, and leaves the rest of the file untouched.\n7. Lifecycle tests matching the existing ones: an install, reinstall and uninstall test in `tests/test_cli_install.py` shaped like `test_copilot_cli_install_reinstall_uninstall_lifecycle`, and a passing run of the all-platforms sweep in `tests/test_uninstall.py` (`test_uninstall_removes_mcp_entry_for_every_current_platform_spec`), which covers every new entry automatically.\n8. Evidence from a real released client: a screenshot or transcript of a session in that client where a reviewgraph tool is invoked and returns a result. A rendered image of text, a mockup or a description of what should happen is not evidence.\n\nIf no maintainer can install and run the client, the request may be declined or left open until someone who uses it is willing to own it and respond when it breaks. An existing target may also be removed if it breaks and nobody steps up to fix it.\n\n## Reporting Issues\n\n- Open an issue through the issue forms: https://github.com/borg0ai/dx-reviewgraph/issues/new/choose (bug report, feature request or platform request; blank issues are disabled).\n- For questions and ideas, use GitHub Discussions: https://github.com/borg0ai/dx-reviewgraph/discussions\n- Include your Python version, OS, steps to reproduce and the error output.\n\n## License\n\nBy contributing, you agree that your contributions are licensed under the MIT License."},"source-eca12c0a30e25b4b-s1":{"body":"来源：`CONTRIBUTING.md:1-2`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Contributing to ReviewGraph\n"},"source-eca12c0a30e25b4b-s2":{"body":"来源：`CONTRIBUTING.md:3-11`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Development Setup\n\n```bash\ngit clone https://github.com/borg0ai/dx-reviewgraph.git\ncd dx-reviewgraph\nuv sync --group dev                  # requires uv\nuv run pytest tests/ --tb=short -q   # check the setup\n```\n"},"source-eca12c0a30e25b4b-s3":{"body":"来源：`CONTRIBUTING.md:12-26`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Running Tests\n\n```bash\nuv run pytest tests/ --tb=short -q                                                    # all tests\nuv run pytest --cov=graph_engine --cov-report=term-missing --cov-fail-under=65   # with the CI coverage gate\nuv run pytest tests/test_parser.py -v                                                 # one file\n```\n\nCI runs the suite on Python 3.10, 3.11, 3.12 and 3.13 and fails below 65% coverage.\n\n`tests/test_parser_grammar_contract.py` checks every built-in class, function, import,\nand call dispatch name against its bundled Tree-sitter grammar. When updating a grammar\nor adding dispatch entries, use the grammar's actual named node types. This contract\nchecks configured dispatch names; language fixtures still verify extraction behavior.\n"},"source-eca12c0a30e25b4b-s4":{"body":"来源：`CONTRIBUTING.md:27-35`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Linting and Type Checking\n\n```bash\nuv run ruff check modules/code-review/graph_engine/ apps/cli/reviewgraph/\nuv run mypy modules/code-review/graph_engine/ apps/cli/reviewgraph/ --ignore-missing-imports --no-strict-optional\n```\n\nCI also runs `bandit -r modules/code-review/graph_engine/ -c pyproject.toml`.\n"},"source-eca12c0a30e25b4b-s5":{"body":"来源：`CONTRIBUTING.md:36-42`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Code Style\n\n- Line length: 100 characters.\n- Target: Python 3.10+.\n- Linter: ruff with rules E, F, I, N, W. Imports are sorted by ruff.\n- SQL: parameterised queries (`?` placeholders) only.\n"},"source-eca12c0a30e25b4b-s6":{"body":"来源：`CONTRIBUTING.md:43-50`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Making Changes\n\n1. Fork the repository and create a branch from `main`: `git switch -c feature/your-feature origin/main`.\n2. Make the change and add tests for new behaviour.\n3. Run the tests, ruff and mypy as above.\n4. Update docs where behaviour changed (README, `docs/`, docstrings).\n5. Open a pull request against `main`. The template asks for the linked issue, what changed and why, and the commands you ran.\n"},"source-eca12c0a30e25b4b-s7":{"body":"来源：`CONTRIBUTING.md:51-68`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Branching\n\nCreate a short-lived feature branch from `origin/main` and send every change\nthrough a pull request directly to `main`:\n\n```bash\ngit fetch origin\ngit switch -c feature/your-change origin/main\n```\n\nRun the checks listed in Development Setup, then open a PR against `main`. CI and the\nReviewGraph PR review workflow run on the PR. Merge through GitHub. Tag releases from `main`.\n\nThe optional release gate is separate from routine PR CI. Run\n`.github/workflows/release-gate.yml` manually before a release when slow upgrade,\npackaging, determinism, E2E, corpus and browser checks are needed. It reports to the\nworkflow summary and a `release-gate` issue; it does not open or merge pull requests.\n"},"source-eca12c0a30e25b4b-s8":{"body":"来源：`CONTRIBUTING.md:69-82`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Project Structure\n\nThe module list is in the Architecture section of `CLAUDE.md`. In outline:\n\n```\napps/cli/pyproject.toml                 # CLI application package and entry points\napps/cli/reviewgraph/               # reviewgraph and reviewgraph-daemon commands\nmodules/code-review/pyproject.toml       # reusable core module package\nmodules/code-review/graph_engine/        # core library, MCP server, tools and eval\nmodules/code-review/skills/             # skills bundled into the core wheel\ntests/                                  # pytest suite and language fixtures\ndocs/                                   # user documentation\n```\n"},"source-eca12c0a30e25b4b-s9":{"body":"来源：`CONTRIBUTING.md:83-91`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Adding Language Support\n\nIf you only need a language for your own repository, you may not need to change this project: add a `.reviewgraph/languages.toml` that maps extensions and node types to any grammar in tree-sitter-language-pack (see [docs/CUSTOM_LANGUAGES.md](docs/CUSTOM_LANGUAGES.md)). To add built-in support:\n\n1. Add the extension mapping to `EXTENSION_TO_LANGUAGE` in `parser.py`.\n2. Add the tree-sitter node types to `_CLASS_TYPES`, `_FUNCTION_TYPES`, `_IMPORT_TYPES` and `_CALL_TYPES`.\n3. Add a sample file in `tests/fixtures/`.\n4. Add parsing tests in `tests/test_multilang.py`.\n"},"source-eca12c0a30e25b4b-s10":{"body":"来源：`CONTRIBUTING.md:92-108`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Adding a Platform Target\n\nEvery supported AI tool is permanent maintenance surface: its config path, schema, install merge, uninstall and tests have to keep working on every release. Some existing targets were merged without evidence that they worked in a released client, and those are the ones that break. New targets are held to the bar below.\n\nStart with a platform request issue (https://github.com/borg0ai/dx-reviewgraph/issues/new/choose) so the client can be discussed before anyone writes code. A pull request that adds a platform will not be reviewed until it includes all of the following.\n\n1. A link to the platform's official MCP configuration documentation. Blog posts, forum replies and screenshots of a settings dialog are not enough.\n2. The exact config file path and the exact schema of a server entry: which top-level key holds the servers, whether that value is an object or an array, and whether a `type` field is required.\n3. The entry added through the existing `PLATFORMS` table in `modules/code-review/graph_engine/skills.py`, plus `_PLATFORM_CHOICES` in `apps/cli/reviewgraph/cli.py`. Use the fields already there: `name`, `config_path`, `key`, `detect`, `format`, `needs_type`, and where needed `legacy_keys`, `server_type`, `entry_fields`. If the client needs something the table cannot express, say so in the pull request and explain why, rather than adding a separate code path beside it.\n4. Preservation of unrelated user settings. Install must merge only the `reviewgraph` server entry and leave every other server, key and top-level setting intact. If the file cannot be parsed, install must skip it rather than rewrite it.\n5. A byte-idempotent reinstall. Running install twice must leave the config file and any generated instruction file byte for byte identical.\n6. A working uninstall in `modules/code-review/graph_engine/uninstall.py` that removes only what install added, including any legacy keys, and leaves the rest of the file untouched.\n7. Lifecycle tests matching the existing ones: an install, reinstall and uninstall test in `tests/test_cli_install.py` shaped like `test_copilot_cli_install_reinstall_uninstall_lifecycle`, and a passing run of the all-platforms sweep in `tests/test_uninstall.py` (`test_uninstall_removes_mcp_entry_for_every_current_platform_spec`), which covers every new entry automatically.\n8. Evidence from a real released client: a screenshot or transcript of a session in that client where a reviewgraph tool is invoked and returns a result. A rendered image of text, a mockup or a description of what should happen is not evidence.\n\nIf no maintainer can install and run the client, the request may be declined or left open until someone who uses it is willing to own it and respond when it breaks. An existing target may also be removed if it breaks and nobody steps up to fix it.\n"},"source-eca12c0a30e25b4b-s11":{"body":"来源：`CONTRIBUTING.md:109-114`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Reporting Issues\n\n- Open an issue through the issue forms: https://github.com/borg0ai/dx-reviewgraph/issues/new/choose (bug report, feature request or platform request; blank issues are disabled).\n- For questions and ideas, use GitHub Discussions: https://github.com/borg0ai/dx-reviewgraph/discussions\n- Include your Python version, OS, steps to reproduce and the error output.\n"},"source-eca12c0a30e25b4b-s12":{"body":"来源：`CONTRIBUTING.md:115-117`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## License\n\nBy contributing, you agree that your contributions are licensed under the MIT License."},"source-399080f41ccf73c6":{"body":"# GEMINI.md\n\n范围：.\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Gemini\n\nAgent rules for this repository live in [AGENTS.md](AGENTS.md). Project\ncontext (architecture, commands, conventions, tests) lives in\n[CLAUDE.md](CLAUDE.md). Both apply to Gemini CLI and Antigravity.\n\nThis file used to be a byte-identical copy of\n[.github/copilot-instructions.md](.github/copilot-instructions.md), which only\nexists because Copilot reads that exact path. Keeping a pointer here means the\ninstructions are maintained in one place."},"source-399080f41ccf73c6-s1":{"body":"来源：`GEMINI.md:1-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Gemini\n\nAgent rules for this repository live in [AGENTS.md](AGENTS.md). Project\ncontext (architecture, commands, conventions, tests) lives in\n[CLAUDE.md](CLAUDE.md). Both apply to Gemini CLI and Antigravity.\n\nThis file used to be a byte-identical copy of\n[.github/copilot-instructions.md](.github/copilot-instructions.md), which only\nexists because Copilot reads that exact path. Keeping a pointer here means the\ninstructions are maintained in one place."},"folder:skill:modules":{"body":"# modules\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:skill:modules/code-review":{"body":"# modules/code-review\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:skill:modules/code-review/skill 引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: debug-issue\ndescription: Systematically debug issues using graph-powered code navigation\n---\n\n## Debug Issue\n\nTrace a bug through the knowledge graph before reading source.\n\n### Steps\n\n1. Call `semantic_search_nodes_tool` to find code related to the issue.\n2. Call `query_graph_tool` with `callers_of` and `callees_of` to trace the call chain in both directions.\n3. Call `get_flow_tool` for the execution path that reaches the suspect code. Its entry point is where the bug is triggered.\n4. Call `detect_changes_tool` to check whether a recent change caused the issue.\n5. Call `get_impact_radius_tool` on the suspect files to see what a fix would affect.\n\n## Token Efficiency Rules\n- Call `get_minimal_context_tool(task=\"\u003cyour task>\")` before any other graph tool.\n- Pass `detail_level=\"minimal\"` wherever a tool accepts it. Use \"standard\" only when minimal is not enough.\n- Prefer a targeted `query_graph_tool` call over a broad listing call.\n- Budget: about five tool calls and 800 tokens of graph output per task.\n- Read the implementation and its tests before changing code. The graph narrows scope; it does not replace the source."},"source-49fb3f3266a3b9e4-s1":{"body":"来源：`modules/code-review/skills/debug-issue/SKILL.md:6-9`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Debug Issue\n\nTrace a bug through the knowledge graph before reading source.\n"},"source-49fb3f3266a3b9e4-s2":{"body":"来源：`modules/code-review/skills/debug-issue/SKILL.md:10-17`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Steps\n\n1. Call `semantic_search_nodes_tool` to find code related to the issue.\n2. Call `query_graph_tool` with `callers_of` and `callees_of` to trace the call chain in both directions.\n3. Call `get_flow_tool` for the execution path that reaches the suspect code. Its entry point is where the bug is triggered.\n4. Call `detect_changes_tool` to check whether a recent change caused the issue.\n5. Call `get_impact_radius_tool` on the suspect files to see what a fix would affect.\n"},"source-49fb3f3266a3b9e4-s3":{"body":"来源：`modules/code-review/skills/debug-issue/SKILL.md:18-23`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Token Efficiency Rules\n- Call `get_minimal_context_tool(task=\"\u003cyour task>\")` before any other graph tool.\n- Pass `detail_level=\"minimal\"` wherever a tool accepts it. Use \"standard\" only when minimal is not enough.\n- Prefer a targeted `query_graph_tool` call over a broad listing call.\n- Budget: about five tool calls and 800 tokens of graph output per task.\n- Read the implementation and its tests before changing code. The graph narrows scope; it does not replace the source."},"folder:skill:modules/code-review/skills/explore-codebase":{"body":"# modules/code-review/skills/explore-codebase\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-d3c598d9d2cf1d85":{"body":"# modules/code-review/skills/explore-codebase/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: explore-codebase\ndescription: Navigate and understand codebase structure using the knowledge graph\n---\n\n## Explore Codebase\n\nUse the reviewgraph MCP tools to find your way around the codebase.\n\n### Steps\n\n1. Call `get_architecture_overview_tool` for the community structure. Call `list_communities_tool`, then `get_community_tool`, only for the modules you need.\n2. Call `semantic_search_nodes_tool` to find a function or class by name or keyword.\n3. Call `query_graph_tool` with `callers_of`, `callees_of` or `imports_of` to trace relationships. `children_of` on a file lists its functions and classes.\n4. Call `list_flows_tool`, then `get_flow_tool` for one flow, to follow an execution path.\n5. Call `find_large_functions_tool` to find oversized functions.\n6. Call `list_graph_stats_tool` only when you need node, edge and language counts.\n\n## Token Efficiency Rules\n- Call `get_minimal_context_tool(task=\"\u003cyour task>\")` before any other graph tool.\n- Pass `detail_level=\"minimal\"` wherever a tool accepts it. Use \"standard\" only when minimal is not enough.\n- Prefer a targeted `query_graph_tool` call over a broad listing call.\n- Budget: about five tool calls and 800 tokens of graph output per task.\n- Read the implementation and its tests before changing code. The graph narrows scope; it does not replace the source."},"source-d3c598d9d2cf1d85-s1":{"body":"来源：`modules/code-review/skills/explore-codebase/SKILL.md:6-9`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Explore Codebase\n\nUse the reviewgraph MCP tools to find your way around the codebase.\n"},"source-d3c598d9d2cf1d85-s2":{"body":"来源：`modules/code-review/skills/explore-codebase/SKILL.md:10-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Steps\n\n1. Call `get_architecture_overview_tool` for the community structure. Call `list_communities_tool`, then `get_community_tool`, only for the modules you need.\n2. Call `semantic_search_nodes_tool` to find a function or class by name or keyword.\n3. Call `query_graph_tool` with `callers_of`, `callees_of` or `imports_of` to trace relationships. `children_of` on a file lists its functions and classes.\n4. Call `list_flows_tool`, then `get_flow_tool` for one flow, to follow an execution path.\n5. Call `find_large_functions_tool` to find oversized functions.\n6. Call `list_graph_stats_tool` only when you need node, edge and language counts.\n"},"source-d3c598d9d2cf1d85-s3":{"body":"来源：`modules/code-review/skills/explore-codebase/SKILL.md:19-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Token Efficiency Rules\n- Call `get_minimal_context_tool(task=\"\u003cyour task>\")` before any other graph tool.\n- Pass `detail_level=\"minimal\"` wherever a tool accepts it. Use \"standard\" only when minimal is not enough.\n- Prefer a targeted `query_graph_tool` call over a broad listing call.\n- Budget: about five tool calls and 800 tokens of graph output per task.\n- Read the implementation and its tests before changing code. The graph narrows scope; it does not replace the source."},"folder:skill:modules/code-review/skills/refactor-safely":{"body":"# modules/code-review/skills/refactor-safely\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-165230b321a5f7ab":{"body":"# modules/code-review/skills/refactor-safely/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: refactor-safely\ndescription: Plan and execute safe refactoring using dependency analysis\n---\n\n## Refactor Safely\n\nPlan a refactor from the dependency graph and apply renames from a preview.\n\n### Steps\n\n1. Call `refactor_tool` with `mode=\"suggest\"` for refactoring candidates, or `mode=\"dead_code\"` for unreferenced code.\n2. For a rename, call `refactor_tool` with `mode=\"rename\"`, `old_name` and `new_name`. Check the returned edit list before applying.\n3. Call `apply_refactor_tool` with the returned `refactor_id` to apply the rename.\n4. Before a large refactor, call `get_impact_radius_tool` and `get_affected_flows_tool` to see the dependents and critical paths involved.\n5. Call `find_large_functions_tool` to find functions worth splitting.\n6. After the change, call `detect_changes_tool` to confirm the impact matches the plan.\n\n## Token Efficiency Rules\n- Call `get_minimal_context_tool(task=\"\u003cyour task>\")` before any other graph tool.\n- Pass `detail_level=\"minimal\"` wherever a tool accepts it. Use \"standard\" only when minimal is not enough.\n- Prefer a targeted `query_graph_tool` call over a broad listing call.\n- Budget: about five tool calls and 800 tokens of graph output per task.\n- Read the implementation and its tests before changing code. The graph narrows scope; it does not replace the source."},"source-165230b321a5f7ab-s1":{"body":"来源：`modules/code-review/skills/refactor-safely/SKILL.md:6-9`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Refactor Safely\n\nPlan a refactor from the dependency graph and apply renames from a preview.\n"},"source-165230b321a5f7ab-s2":{"body":"来源：`modules/code-review/skills/refactor-safely/SKILL.md:10-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Steps\n\n1. Call `refactor_tool` with `mode=\"suggest\"` for refactoring candidates, or `mode=\"dead_code\"` for unreferenced code.\n2. For a rename, call `refactor_tool` with `mode=\"rename\"`, `old_name` and `new_name`. Check the returned edit list before applying.\n3. Call `apply_refactor_tool` with the returned `refactor_id` to apply the rename.\n4. Before a large refactor, call `get_impact_radius_tool` and `get_affected_flows_tool` to see the dependents and critical paths involved.\n5. Call `find_large_functions_tool` to find functions worth splitting.\n6. After the change, call `detect_changes_tool` to confirm the impact matches the plan.\n"},"source-165230b321a5f7ab-s3":{"body":"来源：`modules/code-review/skills/refactor-safely/SKILL.md:19-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Token Efficiency Rules\n- Call `get_minimal_context_tool(task=\"\u003cyour task>\")` before any other graph tool.\n- Pass `detail_level=\"minimal\"` wherever a tool accepts it. Use \"standard\" only when minimal is not enough.\n- Prefer a targeted `query_graph_tool` call over a broad listing call.\n- Budget: about five tool calls and 800 tokens of graph output per task.\n- Read the implementation and its tests before changing code. The graph narrows scope; it does not replace the source."},"folder:skill:modules/code-review/skills/review-changes":{"body":"# modules/code-review/skills/review-changes\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-263ae617603b16d1":{"body":"# modules/code-review/skills/review-changes/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: review-changes\ndescription: Perform a structured code review using change detection and impact\n---\n\n## Review Changes\n\nReview a change set with risk scores and blast radius from the knowledge graph.\n\n### Steps\n\n1. Call `detect_changes_tool` for risk-scored changed functions, test gaps and affected flows.\n2. Call `get_affected_flows_tool` only when you need the steps of an affected flow.\n3. For each high-risk function, call `query_graph_tool` with `pattern=\"tests_for\"` to check test coverage.\n4. Call `get_impact_radius_tool` when the blast radius is not clear from step 1.\n5. Suggest specific test cases for untested changes.\n\n### Output Format\n\nGroup findings by risk level (high, medium, low). For each finding give what changed and why it matters, its test coverage, and the suggested fix. End with a merge recommendation.\n\n## Token Efficiency Rules\n- Call `get_minimal_context_tool(task=\"\u003cyour task>\")` before any other graph tool.\n- Pass `detail_level=\"minimal\"` wherever a tool accepts it. Use \"standard\" only when minimal is not enough.\n- Prefer a targeted `query_graph_tool` call over a broad listing call.\n- Budget: about five tool calls and 800 tokens of graph output per task.\n- Read the implementation and its tests before changing code. The graph narrows scope; it does not replace the source."},"source-263ae617603b16d1-s1":{"body":"来源：`modules/code-review/skills/review-changes/SKILL.md:6-9`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Review Changes\n\nReview a change set with risk scores and blast radius from the knowledge graph.\n"},"source-263ae617603b16d1-s2":{"body":"来源：`modules/code-review/skills/review-changes/SKILL.md:10-17`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Steps\n\n1. Call `detect_changes_tool` for risk-scored changed functions, test gaps and affected flows.\n2. Call `get_affected_flows_tool` only when you need the steps of an affected flow.\n3. For each high-risk function, call `query_graph_tool` with `pattern=\"tests_for\"` to check test coverage.\n4. Call `get_impact_radius_tool` when the blast radius is not clear from step 1.\n5. Suggest specific test cases for untested changes.\n"},"source-263ae617603b16d1-s3":{"body":"来源：`modules/code-review/skills/review-changes/SKILL.md:18-21`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Output Format\n\nGroup findings by risk level (high, medium, low). For each finding give what changed and why it matters, its test coverage, and the suggested fix. End with a merge recommendation.\n"},"source-263ae617603b16d1-s4":{"body":"来源：`modules/code-review/skills/review-changes/SKILL.md:22-27`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Token Efficiency Rules\n- Call `get_minimal_context_tool(task=\"\u003cyour task>\")` before any other graph tool.\n- Pass `detail_level=\"minimal\"` wherever a tool accepts it. Use \"standard\" only when minimal is not enough.\n- Prefer a targeted `query_graph_tool` call over a broad listing call.\n- Budget: about five tool calls and 800 tokens of graph output per task.\n- Read the implementation and its tests before changing code. The graph narrows scope; it does not replace the source."},"folder:skill:modules/code-review/skills/review-delta":{"body":"# modules/code-review/skills/review-delta\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-4d6b9506493b50c4":{"body":"# modules/code-review/skills/review-delta/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: review-delta\ndescription: Review only changes since last commit using impact analysis. Token-efficient delta review with automatic blast-radius detection.\nargument-hint: \"[file or function name]\"\n---\n\n# Review Delta\n\nReview only the changed code and its blast radius.\n\n## Steps\n\n1. Call `get_minimal_context_tool(task=\"review changes\")`. If it returns `status: not_ready`, call `build_or_update_graph_tool()` and continue.\n2. Call `detect_changes_tool(detail_level=\"minimal\")` for risk-scored changed functions, test gaps and affected flows. Changes come from `git diff` against `HEAD~1`; if the argument names a file, pass it in `changed_files`.\n3. Call `get_review_context_tool(detail_level=\"minimal\")` when you need source snippets for the changed areas and `review_guidance` (untested functions, wide blast radius, inheritance changes).\n4. For each untested high-risk function, confirm with `query_graph_tool(pattern=\"tests_for\", target=\"\u003cfunction>\")`.\n5. Use `detail_level=\"standard\"` only for a high-risk item the minimal output leaves unclear. Do not load whole files unless a snippet is not enough.\n\n## Report\n\n- Summary: one line\n- Risk: low, medium or high, from the blast radius\n- Issues: bugs, missing tests, style\n- Blast radius: impacted files and functions\n- Recommendations"},"source-4d6b9506493b50c4-s1":{"body":"来源：`modules/code-review/skills/review-delta/SKILL.md:7-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Review Delta\n\nReview only the changed code and its blast radius.\n"},"source-4d6b9506493b50c4-s2":{"body":"来源：`modules/code-review/skills/review-delta/SKILL.md:11-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Steps\n\n1. Call `get_minimal_context_tool(task=\"review changes\")`. If it returns `status: not_ready`, call `build_or_update_graph_tool()` and continue.\n2. Call `detect_changes_tool(detail_level=\"minimal\")` for risk-scored changed functions, test gaps and affected flows. Changes come from `git diff` against `HEAD~1`; if the argument names a file, pass it in `changed_files`.\n3. Call `get_review_context_tool(detail_level=\"minimal\")` when you need source snippets for the changed areas and `review_guidance` (untested functions, wide blast radius, inheritance changes).\n4. For each untested high-risk function, confirm with `query_graph_tool(pattern=\"tests_for\", target=\"\u003cfunction>\")`.\n5. Use `detail_level=\"standard\"` only for a high-risk item the minimal output leaves unclear. Do not load whole files unless a snippet is not enough.\n"},"source-4d6b9506493b50c4-s3":{"body":"来源：`modules/code-review/skills/review-delta/SKILL.md:19-25`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Report\n\n- Summary: one line\n- Risk: low, medium or high, from the blast radius\n- Issues: bugs, missing tests, style\n- Blast radius: impacted files and functions\n- Recommendations"},"folder:skill:modules/code-review/skills/review-pr":{"body":"# modules/code-review/skills/review-pr\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-9606763421912609":{"body":"# modules/code-review/skills/review-pr/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: review-pr\ndescription: Review a PR or branch diff using the knowledge graph for full structural context. Outputs a structured review with blast-radius analysis.\nargument-hint: \"[PR number or branch name]\"\n---\n\n# Review PR\n\nReview all commits of a pull request or branch against its base branch.\n\n## Steps\n\n1. Identify the changes. With a branch name run `git diff --name-only main...\u003cbranch>`; otherwise diff the current branch against `main` (or `master`). Use that ref as `base` below.\n2. Call `get_minimal_context_tool(task=\"review PR\", base=\"main\")`. If it returns `status: not_ready`, call `build_or_update_graph_tool()` and continue.\n3. Call `detect_changes_tool(base=\"main\", detail_level=\"minimal\")` for risk-scored changed functions, test gaps and affected flows across the whole branch.\n4. For high-risk functions call `query_graph_tool(pattern=\"callers_of\", target=\"\u003cfunction>\")` and `query_graph_tool(pattern=\"tests_for\", target=\"\u003cfunction>\")`. Flag public API changes whose callers were not updated.\n5. Call `get_review_context_tool(base=\"main\")` for source snippets, or `get_impact_radius_tool(base=\"main\")` for the full dependent list, only when step 3 leaves a high-risk item unclear.\n6. Read the changed source of the highest-impact files first. Do not load whole files unless the change needs it.\n\n## Output\n\n```\n## PR Review: \u003ctitle>\n\n### Summary\n\u003c1-3 sentences>\n\n### Risk\n- Overall: Low / Medium / High\n- Blast radius: \u003cn> files, \u003cm> functions\n- Test coverage: \u003ccovered> of \u003cchanged> changed functions\n\n### Files\n#### \u003cpath>\n- Changes: \u003cwhat>\n- Impact: \u003cwho depends on it>\n- Issues: \u003cbugs, style, concerns>\n\n### Missing Tests\n- \u003cfunction> in \u003cfile>\n\n### Recommendations\n1. \u003caction>\n```\n\n## Tips\n\n- Use `semantic_search_nodes_tool` to find related code the PR may have missed."},"source-9606763421912609-s1":{"body":"来源：`modules/code-review/skills/review-pr/SKILL.md:7-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Review PR\n\nReview all commits of a pull request or branch against its base branch.\n"},"source-9606763421912609-s2":{"body":"来源：`modules/code-review/skills/review-pr/SKILL.md:11-19`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Steps\n\n1. Identify the changes. With a branch name run `git diff --name-only main...\u003cbranch>`; otherwise diff the current branch against `main` (or `master`). Use that ref as `base` below.\n2. Call `get_minimal_context_tool(task=\"review PR\", base=\"main\")`. If it returns `status: not_ready`, call `build_or_update_graph_tool()` and continue.\n3. Call `detect_changes_tool(base=\"main\", detail_level=\"minimal\")` for risk-scored changed functions, test gaps and affected flows across the whole branch.\n4. For high-risk functions call `query_graph_tool(pattern=\"callers_of\", target=\"\u003cfunction>\")` and `query_graph_tool(pattern=\"tests_for\", target=\"\u003cfunction>\")`. Flag public API changes whose callers were not updated.\n5. Call `get_review_context_tool(base=\"main\")` for source snippets, or `get_impact_radius_tool(base=\"main\")` for the full dependent list, only when step 3 leaves a high-risk item unclear.\n6. Read the changed source of the highest-impact files first. Do not load whole files unless the change needs it.\n"},"source-9606763421912609-s3":{"body":"来源：`modules/code-review/skills/review-pr/SKILL.md:20-45`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Output\n\n```\n## PR Review: \u003ctitle>\n\n### Summary\n\u003c1-3 sentences>\n\n### Risk\n- Overall: Low / Medium / High\n- Blast radius: \u003cn> files, \u003cm> functions\n- Test coverage: \u003ccovered> of \u003cchanged> changed functions\n\n### Files\n#### \u003cpath>\n- Changes: \u003cwhat>\n- Impact: \u003cwho depends on it>\n- Issues: \u003cbugs, style, concerns>\n\n### Missing Tests\n- \u003cfunction> in \u003cfile>\n\n### Recommendations\n1. \u003caction>\n```\n"},"source-9606763421912609-s4":{"body":"来源：`modules/code-review/skills/review-pr/SKILL.md:46-48`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Tips\n\n- Use `semantic_search_nodes_tool` to find related code the PR may have missed."},"source-6ebdb617a8104a77":{"body":"# CLAUDE.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：AGENTS.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# CLAUDE.md - Project Context for Claude Code\n\n## Project Overview\n\nReviewGraph is a local-first knowledge graph for code review. It parses a repository with Tree-sitter (plus targeted fallbacks), stores nodes and edges in SQLite, updates the graph incrementally from Git changes, and serves compact context over MCP and the CLI to AI coding tools. Supported platforms are the entries in `PLATFORMS` in `skills.py`: Claude Code, Codex, Cursor, Windsurf, Zed, Continue, OpenCode, Antigravity, Gemini CLI, Qwen Code, Kiro, Qoder, GitHub Copilot, GitHub Copilot CLI, Hermes Agent and CodeBuddy Code.\n\n## Graph Tool Usage (Token-Efficient)\n\nWhen using reviewgraph MCP tools:\n\n1. Call `get_minimal_context_tool(task=\"\u003cdescription>\")` first. It costs about 100 tokens and gives the overview.\n2. Use `detail_level=\"minimal\"` on every later call unless that is not enough.\n3. Prefer `query_graph_tool` with a specific target over broad `list_*` calls.\n4. Follow the `next_tool_suggestions` field in each response.\n5. Target: at most 5 tool calls and 800 tokens of graph context per task.\n\nAll registered tool names end in `_tool`. The 30 tools are defined in `main.py`.\n\n## Architecture\n\nCore module `modules/code-review/graph_engine/` (Python 3.10+). CLI app `apps/cli/reviewgraph/`.\n\n- `main.py`: FastMCP server entry point. Registers 30 tools and 5 prompts.\n- `tools/`: tool implementations by domain: `build.py`, `query.py`, `review.py`, `context.py`, `flows_tools.py`, `community_tools.py`, `refactor_tools.py`, `docs.py`, `registry_tools.py`, `analysis_tools.py`; shared helpers in `_common.py`.\n- `prompts.py`: 5 MCP prompts (review_changes, architecture_map, debug_issue, onboard_developer, pre_merge_check).\n- `apps/cli/reviewgraph/cli.py` owns the `reviewgraph` command. `daemon.py` is core; `apps/cli/reviewgraph/daemon_cli.py` owns the `reviewgraph-daemon` command.\n- `parser.py`: Tree-sitter multi-language parser with fallbacks for notebooks and other formats. `custom_languages.py`: languages defined in `.reviewgraph/languages.toml` (see docs/CUSTOM_LANGUAGES.md).\n- `graph.py`: SQLite graph store (nodes, edges, impact analysis). `migrations.py`: schema migrations; current schema version is 13.\n- `incremental.py`: full build, Git/SVN change detection, incremental update, stale-file reconciliation, watch mode. `postprocessing.py`: shared post-build pipeline (signatures, flows, communities, FTS).\n- Post-build resolvers: `python_resolver.py`, `jedi_resolver.py` (optional `enrichment` extra), `spring_resolver.py`, `event_resolver.py`, `temporal_resolver.py`, `config_keys.py`, `scoped_resolver.py` (PHP, Rust, C#), `rescript_resolver.py`, `hcl_resolver.py`, `tsconfig_resolver.py` (tsconfig and jsconfig path aliases).\n- `flows.py`: execution flows and criticality. `communities.py`: Leiden via igraph (optional) or file-based grouping, plus the architecture overview. `analysis.py`: hub and bridge nodes, knowledge gaps, surprise scoring, suggested questions.\n- `search.py`: FTS5 keyword search combined with optional vector search. `embeddings.py`: providers for local sentence-transformers, OpenAI-compatible endpoints, Google Gemini, MiniMax and Voyage AI.\n- `changes.py`: risk-scored change analysis. `refactor.py`: rename preview, dead code, suggestions. `hints.py`: `next_tool_suggestions`. `uncertainty.py`: `confidence` notes on empty results. `context_savings.py`: estimated context-savings metadata.\n- `visualization.py`: D3.js HTML graph (D3 is bundled in `assets/`). `exports.py`: JSON, GraphML, Neo4j Cypher, Obsidian, SVG. `wiki.py`: Markdown wiki. `graph_diff.py`: snapshot diffing. `memory.py`: stored Q&A feedback.\n- `skills.py`: `install` (platform MCP configs, hooks, skills, instruction blocks). `_legacy_instructions.py`: instruction blocks shipped by earlier releases. `jsonc.py`: comment-preserving JSONC tokenising and splices, shared by install and uninstall so neither flattens a commented config. `uninstall.py`: reverses `install`. `enrich.py`: PreToolUse hook enrichment. `forget.py`: drops files from the graph. `registry.py`: multi-repo registry. `http_origin_guard.py`: Host/Origin checks for `serve --http`. `token_benchmark.py` and `eval/`: benchmarks. `constants.py`: shared constants.\n- `modules/code-review/graph_engine/docs/LLM-OPTIMIZED-REFERENCE.md`: the reference served by `get_docs_section_tool`.\n\nDatabase: `.reviewgraph/graph.db` (SQLite, WAL mode).\n\n## Key Commands\n\n```bash\n# Development\nuv run pytest tests/ --tb=short -q\nuv run ruff check modules/code-review/graph_engine/ apps/cli/reviewgraph/\nuv run mypy modules/code-review/graph_engine/ apps/cli/reviewgraph/ --ignore-missing-imports --no-strict-optional\n\n# Graph\nuv run reviewgraph build              # full build\nuv run reviewgraph update             # incremental update\nuv run reviewgraph status             # graph statistics\nuv run reviewgraph detect-changes     # risk-scored change analysis (read-only)\nuv run reviewgraph forget PATH        # drop files from the graph\nuv run reviewgraph serve              # MCP server (stdio; --http for localhost)\nuv run reviewgraph wiki               # Markdown wiki\nuv run reviewgraph register \u003cpath>    # add a repo to the multi-repo registry\nuv run reviewgraph eval               # benchmarks\nuv run reviewgraph --help             # full command list\n```\n\n## Code Conventions\n\n- Line length 100 (ruff). Python 3.10+.\n- SQL: parameterised queries with `?` placeholders. Never format values into SQL strings.\n- Errors: catch specific exceptions and log with `logger.warning` or `logger.error`.\n- Threads: `threading.Lock` around shared caches; SQLite opened with `check_same_thread=False`.\n- Node names: pass through `_sanitize_name()` before returning them to MCP clients.\n- File reads: read the bytes once, hash them, then parse the same bytes.\n\n## Security Invariants\n\n- No `eval()`, `exec()`, `pickle` or `yaml.unsafe_load()`.\n- No `shell=True` in subprocess calls.\n- `_validate_repo_root()` requires an existing directory containing `.git`, `.svn` or `.reviewgraph`, which blocks path traversal through `repo_root`.\n- `_sanitize_name()` strips control characters and caps names at 256 characters.\n- `escH()` in `visualization.py` escapes HTML entities including quotes and backticks; `\u003c/script>` is escaped inside embedded JSON.\n- D3.js is bundled and loaded with an SRI hash; the CDN fallback carries the same hash.\n- `http_origin_guard.py` validates Host and Origin for `serve --http`.\n- API keys come from environment variables only.\n\n## Test Structure\n\n`tests/` holds over 100 pytest modules. The main groups:\n\n- Core: `test_parser.py`, `test_graph.py`, `test_incremental.py`, `test_tools.py`, `test_main.py`, `test_cli*.py`.\n- Features: `test_flows.py`, `test_communities.py`, `test_changes.py`, `test_refactor.py`, `test_search.py`, `test_hints.py`, `test_prompts.py`, `test_wiki.py`, `test_embeddings.py`, `test_eval.py`, `test_registry.py`, `test_migrations.py`, `test_uncertainty.py`, `test_context_savings.py`, `test_token_budget.py` (per-tool token budgets).\n- Languages: `test_multilang.py`, `test_custom_languages.py`, `test_notebook.py`, plus per-language files such as `test_php_*.py`, `test_spring_*.py`, `test_kotlin_imports.py`, `test_go_embeddings.py`, `test_cpp_*.py`, `test_typescript_node_extensions.py`, `test_tsconfig_resolver.py`, `test_hcl_parser.py`, `test_dbt_parser.py`, `test_ansible_parser.py`.\n- Regression modules are named after the behaviour they pin, not the PR that produced them. The originating PR number goes in the module docstring.\n- Watch and daemon: `test_watch_*.py`, `test_daemon*.py`.\n- Install and platforms: `test_skills.py`, `test_cli_install.py`, `test_uninstall.py`, `test_git_hook_worktree.py`, `test_hermes_install.py`, `test_qoder_bundled_skills.py`, `test_installer_ownership.py` (what install may rewrite and what belongs to the user), `test_released_shapes.py` (reads the hooks and MCP entries every released tag wrote and requires them to still be recognised; needs tags, skips without them), `test_platform_lifecycle.py` (opt-in marker `platform_lifecycle`).\n- Windows: `test_windows_compat.py`, `test_windows_path_identity.py`.\n- Docs and GitHub Action: `test_documentation.py`, `test_action_render.py`.\n- Distribution gate: `test_packaging.py`, marked `packaging` and **skipped by default**. Builds a wheel and an sdist with `python -m build`, installs each into its own virtual environment, and drives the installed program with the checkout out of reach. Needs network and takes a couple of minutes. Run it before a release with `uv run --python 3.13 python -m pytest tests/test_packaging.py -m packaging`.\n- `tests/fixtures/`: sample files per supported language.\n\n## CI Pipeline\n\n`.github/workflows/ci.yml`:\n\n- lint: ruff on Python 3.10.\n- type-check: mypy.\n- security: bandit with the exemptions in `pyproject.toml`.\n- test: pytest on Python 3.10, 3.11, 3.12 and 3.13; coverage must be at least 65%.\n- google-embeddings: constructs the Google provider with the `google-embeddings` and `all` extras.\n- windows-native: a subset of the suite on windows-latest.\n\n## IssueGraph issue tracking\n\nThis project uses IssueGraph. Run `issuegraph prime` for current workflow and command guidance.\n\nUse `issuegraph ready`, `issuegraph show \u003cid>`, `issuegraph update \u003cid> --claim`, and\n`issuegraph close \u003cid>` for task tracking. Use `issuegraph remember \"insight\"` for persistent\nproject knowledge. Do not create Markdown TODO lists.\n\nIssueGraph stores its local database under `.issuegraph/` and tracks `issues.jsonl` plus\n`manifest.json` in Git. Do not create branches, commit, push, merge, or sync IssueGraph remotes\nunless the user explicitly asks. When asked for a PR, target `main`.\n\nBefore handoff, run relevant quality checks and report changed files and validation results.\n\n\u003c!-- reviewgraph MCP tools -->\n## MCP Tools: reviewgraph\n\n**This project has a knowledge graph. Start with the reviewgraph\nMCP tools to narrow scope, then read the source.** The graph is cheaper than scanning files and\ngives you structural context (callers, dependents, test coverage) that file search cannot.\n\n### When to use graph tools FIRST\n\n- **Exploring code**: `semantic_search_nodes_tool` or `query_graph_tool` instead of Grep\n- **Understanding impact**: `get_impact_radius_tool` instead of manually tracing imports\n- **Code review**: `detect_changes_tool` + `get_review_context_tool` instead of reading entire files\n- **Finding relationships**: `query_graph_tool` with callers_of/callees_of/imports_of/tests_for\n- **Architecture questions**: `get_architecture_overview_tool` + `list_communities_tool`\n\n### Verify in the source\n\n- Narrow scope with the graph, then read the source. Do not change code from graph output alone.\n- For any non-trivial change, read the implementation and the relevant tests before concluding.\n- Verify the exact source when touching behavior, database logic, migrations, retries, fallbacks,\n  recovery, or compatibility code.\n- When the graph and the source disagree, the source wins. The graph may be stale or may not\n  model that relationship.\n- An empty graph result can mean \"not indexed\" or \"not statically visible\", not \"does not exist\".\n\n### Key Tools\n\n| Tool | Use when |\n| ------ | ---------- |\n| `detect_changes_tool` | Reviewing code changes — gives risk-scored analysis |\n| `get_review_context_tool` | Need source snippets for review — token-efficient |\n| `get_impact_radius_tool` | Understanding blast radius of a change |\n| `get_affected_flows_tool` | Finding which execution paths are impacted |\n| `query_graph_tool` | Tracing callers, callees, imports, tests, dependencies |\n| `semantic_search_nodes_tool` | Finding functions/classes by name or keyword |\n| `get_architecture_overview_tool` | Understanding high-level codebase structure |\n| `refactor_tool` | Planning renames, finding dead code |\n\n### Workflow\n\n1. The graph auto-updates on file changes (via hooks).\n2. Use `detect_changes_tool` for code review.\n3. Use `get_affected_flows_tool` to understand impact.\n4. Use `query_graph_tool` pattern=\"tests_for\" to check coverage.\n\u003c!-- /reviewgraph MCP tools -->"},"source-6ebdb617a8104a77-s1":{"body":"来源：`CLAUDE.md:1-2`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# CLAUDE.md - Project Context for Claude Code\n"},"source-6ebdb617a8104a77-s2":{"body":"来源：`CLAUDE.md:3-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Project Overview\n\nReviewGraph is a local-first knowledge graph for code review. It parses a repository with Tree-sitter (plus targeted fallbacks), stores nodes and edges in SQLite, updates the graph incrementally from Git changes, and serves compact context over MCP and the CLI to AI coding tools. Supported platforms are the entries in `PLATFORMS` in `skills.py`: Claude Code, Codex, Cursor, Windsurf, Zed, Continue, OpenCode, Antigravity, Gemini CLI, Qwen Code, Kiro, Qoder, GitHub Copilot, GitHub Copilot CLI, Hermes Agent and CodeBuddy Code.\n"},"source-6ebdb617a8104a77-s3":{"body":"来源：`CLAUDE.md:7-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Graph Tool Usage (Token-Efficient)\n\nWhen using reviewgraph MCP tools:\n\n1. Call `get_minimal_context_tool(task=\"\u003cdescription>\")` first. It costs about 100 tokens and gives the overview.\n2. Use `detail_level=\"minimal\"` on every later call unless that is not enough.\n3. Prefer `query_graph_tool` with a specific target over broad `list_*` calls.\n4. Follow the `next_tool_suggestions` field in each response.\n5. Target: at most 5 tool calls and 800 tokens of graph context per task.\n\nAll registered tool names end in `_tool`. The 30 tools are defined in `main.py`.\n"},"source-6ebdb617a8104a77-s4":{"body":"来源：`CLAUDE.md:19-39`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Architecture\n\nCore module `modules/code-review/graph_engine/` (Python 3.10+). CLI app `apps/cli/reviewgraph/`.\n\n- `main.py`: FastMCP server entry point. Registers 30 tools and 5 prompts.\n- `tools/`: tool implementations by domain: `build.py`, `query.py`, `review.py`, `context.py`, `flows_tools.py`, `community_tools.py`, `refactor_tools.py`, `docs.py`, `registry_tools.py`, `analysis_tools.py`; shared helpers in `_common.py`.\n- `prompts.py`: 5 MCP prompts (review_changes, architecture_map, debug_issue, onboard_developer, pre_merge_check).\n- `apps/cli/reviewgraph/cli.py` owns the `reviewgraph` command. `daemon.py` is core; `apps/cli/reviewgraph/daemon_cli.py` owns the `reviewgraph-daemon` command.\n- `parser.py`: Tree-sitter multi-language parser with fallbacks for notebooks and other formats. `custom_languages.py`: languages defined in `.reviewgraph/languages.toml` (see docs/CUSTOM_LANGUAGES.md).\n- `graph.py`: SQLite graph store (nodes, edges, impact analysis). `migrations.py`: schema migrations; current schema version is 13.\n- `incremental.py`: full build, Git/SVN change detection, incremental update, stale-file reconciliation, watch mode. `postprocessing.py`: shared post-build pipeline (signatures, flows, communities, FTS).\n- Post-build resolvers: `python_resolver.py`, `jedi_resolver.py` (optional `enrichment` extra), `spring_resolver.py`, `event_resolver.py`, `temporal_resolver.py`, `config_keys.py`, `scoped_resolver.py` (PHP, Rust, C#), `rescript_resolver.py`, `hcl_resolver.py`, `tsconfig_resolver.py` (tsconfig and jsconfig path aliases).\n- `flows.py`: execution flows and criticality. `communities.py`: Leiden via igraph (optional) or file-based grouping, plus the architecture overview. `analysis.py`: hub and bridge nodes, knowledge gaps, surprise scoring, suggested questions.\n- `search.py`: FTS5 keyword search combined with optional vector search. `embeddings.py`: providers for local sentence-transformers, OpenAI-compatible endpoints, Google Gemini, MiniMax and Voyage AI.\n- `changes.py`: risk-scored change analysis. `refactor.py`: rename preview, dead code, suggestions. `hints.py`: `next_tool_suggestions`. `uncertainty.py`: `confidence` notes on empty results. `context_savings.py`: estimated context-savings metadata.\n- `visualization.py`: D3.js HTML graph (D3 is bundled in `assets/`). `exports.py`: JSON, GraphML, Neo4j Cypher, Obsidian, SVG. `wiki.py`: Markdown wiki. `graph_diff.py`: snapshot diffing. `memory.py`: stored Q&A feedback.\n- `skills.py`: `install` (platform MCP configs, hooks, skills, instruction blocks). `_legacy_instructions.py`: instruction blocks shipped by earlier releases. `jsonc.py`: comment-preserving JSONC tokenising and splices, shared by install and uninstall so neither flattens a commented config. `uninstall.py`: reverses `install`. `enrich.py`: PreToolUse hook enrichment. `forget.py`: drops files from the graph. `registry.py`: multi-repo registry. `http_origin_guard.py`: Host/Origin checks for `serve --http`. `token_benchmark.py` and `eval/`: benchmarks. `constants.py`: shared constants.\n- `modules/code-review/graph_engine/docs/LLM-OPTIMIZED-REFERENCE.md`: the reference served by `get_docs_section_tool`.\n\nDatabase: `.reviewgraph/graph.db` (SQLite, WAL mode).\n"},"source-6ebdb617a8104a77-s5":{"body":"来源：`CLAUDE.md:40-60`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Key Commands\n\n```bash\n# Development\nuv run pytest tests/ --tb=short -q\nuv run ruff check modules/code-review/graph_engine/ apps/cli/reviewgraph/\nuv run mypy modules/code-review/graph_engine/ apps/cli/reviewgraph/ --ignore-missing-imports --no-strict-optional\n\n# Graph\nuv run reviewgraph build              # full build\nuv run reviewgraph update             # incremental update\nuv run reviewgraph status             # graph statistics\nuv run reviewgraph detect-changes     # risk-scored change analysis (read-only)\nuv run reviewgraph forget PATH        # drop files from the graph\nuv run reviewgraph serve              # MCP server (stdio; --http for localhost)\nuv run reviewgraph wiki               # Markdown wiki\nuv run reviewgraph register \u003cpath>    # add a repo to the multi-repo registry\nuv run reviewgraph eval               # benchmarks\nuv run
