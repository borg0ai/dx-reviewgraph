earch cannot.\n"},"source-6ebdb617a8104a77-s12":{"body":"来源：`CLAUDE.md:128-135`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### When to use graph tools FIRST\n\n- **Exploring code**: `semantic_search_nodes_tool` or `query_graph_tool` instead of Grep\n- **Understanding impact**: `get_impact_radius_tool` instead of manually tracing imports\n- **Code review**: `detect_changes_tool` + `get_review_context_tool` instead of reading entire files\n- **Finding relationships**: `query_graph_tool` with callers_of/callees_of/imports_of/tests_for\n- **Architecture questions**: `get_architecture_overview_tool` + `list_communities_tool`\n"},"source-6ebdb617a8104a77-s13":{"body":"来源：`CLAUDE.md:136-145`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Verify in the source\n\n- Narrow scope with the graph, then read the source. Do not change code from graph output alone.\n- For any non-trivial change, read the implementation and the relevant tests before concluding.\n- Verify the exact source when touching behavior, database logic, migrations, retries, fallbacks,\n  recovery, or compatibility code.\n- When the graph and the source disagree, the source wins. The graph may be stale or may not\n  model that relationship.\n- An empty graph result can mean \"not indexed\" or \"not statically visible\", not \"does not exist\".\n"},"source-6ebdb617a8104a77-s14":{"body":"来源：`CLAUDE.md:146-158`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Key Tools\n\n| Tool | Use when |\n| ------ | ---------- |\n| `detect_changes_tool` | Reviewing code changes — gives risk-scored analysis |\n| `get_review_context_tool` | Need source snippets for review — token-efficient |\n| `get_impact_radius_tool` | Understanding blast radius of a change |\n| `get_affected_flows_tool` | Finding which execution paths are impacted |\n| `query_graph_tool` | Tracing callers, callees, imports, tests, dependencies |\n| `semantic_search_nodes_tool` | Finding functions/classes by name or keyword |\n| `get_architecture_overview_tool` | Understanding high-level codebase structure |\n| `refactor_tool` | Planning renames, finding dead code |\n"},"source-6ebdb617a8104a77-s15":{"body":"来源：`CLAUDE.md:159-165`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Workflow\n\n1. The graph auto-updates on file changes (via hooks).\n2. Use `detect_changes_tool` for code review.\n3. Use `get_affected_flows_tool` to understand impact.\n4. Use `query_graph_tool` pattern=\"tests_for\" to check coverage.\n\u003c!-- /reviewgraph MCP tools -->"},"folder:reference:docs":{"body":"# docs\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-f7e659f3180fbf97":{"body":"# docs/CUSTOM_LANGUAGES.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：CONTRIBUTING.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Custom Languages (Bring Your Own Language)\n\nreviewgraph has built-in parsers for more than 35 languages. The\n[tree-sitter-language-pack](https://github.com/Goldziher/tree-sitter-language-pack)\nit depends on bundles many more grammars. If your repository uses a language\nthe graph does not cover (Erlang, Haskell, OCaml, Fortran, Ada, Clojure, ...),\nyou can add it with a config file. No fork, no code changes.\n\n## Quick start\n\nCreate `\u003crepo_root>/.reviewgraph/languages.toml`:\n\n```toml\n[languages.erlang]\nextensions = [\".erl\"]\ngrammar = \"erlang\"\nfunction_node_types = [\"function_clause\"]\nclass_node_types = [\"record_decl\"]\nimport_node_types = [\"import_attribute\"]\ncall_node_types = [\"call\"]\ncomment = \"Erlang via the bundled tree-sitter-erlang grammar\"\n```\n\nThen rebuild:\n\n```bash\nreviewgraph build\n```\n\nFiles with the configured extensions are parsed with the named grammar. The\nresulting `Function` and `Class` nodes and `CALLS` and `IMPORTS_FROM` edges go\nthrough every downstream feature (impact radius, search, communities, wiki,\nMCP tools) like built-in languages. Nodes carry the custom language name (here\n`erlang`) in their `language` field.\n\n## Schema reference\n\nEach custom language is one `[languages.\u003cname>]` table.\n\n| Key | Type | Required | Meaning |\n|-----|------|----------|---------|\n| `\u003cname>` | table key | yes | Language identifier stored on every parsed node. A lowercase letter followed by lowercase letters, digits, `_` or `-`; at most 32 characters. |\n| `extensions` | list of strings | yes | File extensions to claim. Each is a dot followed by 1 to 15 characters from `a-z`, `0-9`, `_`, `+`, `-`. Matched case-insensitively. |\n| `grammar` | string | yes | A grammar name shipped by `tree_sitter_language_pack` (see [Troubleshooting](#troubleshooting) for how to check). |\n| `function_node_types` | list of strings | no* | Node types that define functions or methods. Each becomes a `Function` node, or a `Test` node when its name or location marks it as a test. |\n| `class_node_types` | list of strings | no* | Node types that define classes, records or types. Each becomes a `Class` node. |\n| `import_node_types` | list of strings | no* | Node types for import or include statements. Each yields an `IMPORTS_FROM` edge. |\n| `call_node_types` | list of strings | no* | Node types for call expressions. Each yields a `CALLS` edge from the enclosing function. |\n| `name_field` | string or list of strings | no | Ordered candidates for finding a definition's name when it is not in a `name` field or an identifier child (see below). At most 8. |\n| `comment` | string | no | Free text for humans; ignored by the parser. |\n\n\\* At least one of the four node-type lists must be non-empty, otherwise the\nentry is skipped.\n\n### Validation rules\n\nThe loader never fails a build. An invalid entry is skipped with a `WARNING`\nlog line that says why:\n\n- Built-ins win. A custom language cannot claim a built-in extension (`.py`,\n  `.ts`, `.ex`, ...) or reuse a built-in language name (`python`, `elixir`, ...).\n- `grammar` must load from `tree_sitter_language_pack`.\n- Every extension must start with a dot.\n- Two custom languages cannot claim the same extension; the first one wins.\n- At most 20 custom languages are loaded per repository; the rest are ignored.\n- Malformed TOML disables custom languages for that build.\n- `name_field` must be a string or a list of non-empty strings, at most 8\n  entries.\n\n### Naming definitions with `name_field`\n\nWithout `name_field`, the parser reads a definition's name from the grammar's\n`name` field, then from the first child whose type is identifier-like\n(`identifier`, `name`, `type_identifier`, `property_identifier`,\n`simple_identifier`, `constant`, `field_identifier`). Many grammars keep the\nname elsewhere: in a differently named field, or nested a level or two down.\nA definition whose name cannot be found is dropped. `name_field` says where to\nlook.\n\nCandidates are tried in two passes:\n\n1. Fields. Each candidate is tried as a tree-sitter field name on the\n   definition node. All candidates are tried as fields before any type search,\n   so a precise field beats a broader match.\n2. Typed descendants. If no field matched, the first descendant (up to 4 levels\n   down) whose node type equals a candidate.\n\nThe matched node is reduced to its first text-bearing leaf of a known name type\n(`identifier`, `word`, `name`, `type_identifier`, ...) or, failing that, its own\ntext. Surrounding braces, quotes and whitespace are stripped. Text that is\nempty, spans lines or is longer than 256 characters is rejected. If no\ncandidate resolves, the `name` field fallback above applies.\n\n```toml\n[languages.bibtex]\nextensions = [\".bib\"]\ngrammar = \"bibtex\"\nclass_node_types = [\"entry\"]\nname_field = [\"key\"]            # @article{smith2020,...} -> \"smith2020\"\n\n[languages.latex]\nextensions = [\".tex\"]\ngrammar = \"latex\"\nclass_node_types = [\"section\", \"chapter\", \"subsection\"]\nfunction_node_types = [\"new_command_definition\"]\nname_field = [\"name\", \"text\", \"declaration\"]\n#   \\section{Introduction}   -> \"Introduction\" (via `text`)\n#   \\newcommand{\\foo}{bar}    -> \"\\foo\"        (via `declaration`)\n\n[languages.markdown]\nextensions = [\".md\"]\ngrammar = \"markdown\"\nclass_node_types = [\"section\"]\nname_field = [\"inline\"]         # \"# My Heading\" -> \"My Heading\" (typed descendant)\n```\n\nUse a list when node types keep their names in different places (LaTeX\n`section` uses `text`, `\\newcommand` uses `declaration`): the first candidate\nthat resolves wins.\n\n## Finding the right node type names\n\nNode type names are grammar-specific. Two ways to see them:\n\n**Tree-sitter playground.** Paste a snippet into\n\u003chttps://tree-sitter.github.io/tree-sitter/7-playground.html>, select the\ngrammar, and read the node names off the tree.\n\n**Probe locally.** The grammar version your build uses is the one in\n`tree_sitter_language_pack`, so this is the reliable source:\n\n```bash\npython - \u003c\u003c'EOP'\nimport tree_sitter_language_pack as tslp\n\nsource = b\"\"\"\n-module(math_utils).\nadd(A, B) -> helper(A) + B.\nhelper(X) -> X * 2.\n\"\"\"\n\ndef dump(node, depth=0):\n    print(\"  \" * depth + node.type, node.text.decode()[:40].replace(\"\\n\", \" \"))\n    for child in node.children:\n        dump(child, depth + 1)\n\ndump(tslp.get_parser(\"erlang\").parse(source).root_node)\nEOP\n```\n\nPick node types that wrap whole definitions (`function_clause`, not the inner\n`atom`) and whole call expressions (`call`, not the callee identifier).\n\n## Worked example: Erlang end to end\n\n`src/math_utils.erl`:\n\n```erlang\n-module(math_utils).\n-export([add/2, scale/2]).\n-import(lists, [map/2]).\n\n-record(point, {x, y}).\n\nadd(A, B) ->\n    helper(A) + B.\n\nhelper(X) -> X * 2.\n\nscale(Points, F) ->\n    lists:map(fun(P) -> add(P, F) end, Points).\n```\n\nWith the `[languages.erlang]` config from the quick start, a build produces:\n\n- `Function` nodes `add`, `helper`, `scale` (from `function_clause`), each\n  with `language = \"erlang\"`.\n- A `Class` node `point` (from `record_decl`).\n- `CALLS` edges `add -> helper` and `scale -> add`, resolved to their\n  same-file qualified names, plus `scale -> lists:map` for the remote call.\n- An `IMPORTS_FROM` edge targeting `lists` (from `import_attribute`).\n- `CONTAINS` edges from the file to every definition.\n\n## How extraction works (and its limits)\n\nCustom languages go through the same generic tree-sitter walker as built-in\nlanguages. There is no per-language code path, which keeps the feature simple\nand sets its limits:\n\n- Names come from `name_field`, then the grammar's `name` field, then an\n  identifier-like child (see above). Definitions with no resolvable name are\n  dropped.\n- Callees are read from the call node's `function`, `callee`, `expr` or `name`\n  field, in that order, descending through nested applications of the same\n  field (curried calls). Callee text that spans lines or exceeds 256 characters\n  is dropped. Other call shapes are missed.\n- Import targets come from the statement's `module`, `name`, `path` or `source`\n  field; otherwise the whole statement text is recorded.\n- No cross-file module resolution. Import edges keep the module name as written\n  (`lists`); they are not resolved to file paths as built-in languages with\n  dedicated resolvers are.\n- No language-specific extras: decorator-based test detection, framework\n  annotations (Spring, Temporal) and SFC handling exist only for built-in\n  languages.\n\nIf a language needs more than the generic walker gives, open an issue.\n\n## Troubleshooting\n\n- The loader logs a `WARNING` for every skipped entry, naming the config file,\n  the language and the reason. The CLI prints log lines to stderr during\n  `build` and `update`; `-q` does not hide warnings.\n- Check a grammar is bundled:\n  `python -c \"import tree_sitter_language_pack as t; t.get_language('erlang')\"`.\n  It raises `LookupError` if it is not.\n- The config is read when a parser is constructed and cached by file mtime and\n  size. `update` re-parses only changed files, so run `reviewgraph build`\n  after editing the config to apply it to every file."},"source-f7e659f3180fbf97-s1":{"body":"来源：`docs/CUSTOM_LANGUAGES.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Custom Languages (Bring Your Own Language)\n\nreviewgraph has built-in parsers for more than 35 languages. The\n[tree-sitter-language-pack](https://github.com/Goldziher/tree-sitter-language-pack)\nit depends on bundles many more grammars. If your repository uses a language\nthe graph does not cover (Erlang, Haskell, OCaml, Fortran, Ada, Clojure, ...),\nyou can add it with a config file. No fork, no code changes.\n"},"source-f7e659f3180fbf97-s2":{"body":"来源：`docs/CUSTOM_LANGUAGES.md:9-35`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Quick start\n\nCreate `\u003crepo_root>/.reviewgraph/languages.toml`:\n\n```toml\n[languages.erlang]\nextensions = [\".erl\"]\ngrammar = \"erlang\"\nfunction_node_types = [\"function_clause\"]\nclass_node_types = [\"record_decl\"]\nimport_node_types = [\"import_attribute\"]\ncall_node_types = [\"call\"]\ncomment = \"Erlang via the bundled tree-sitter-erlang grammar\"\n```\n\nThen rebuild:\n\n```bash\nreviewgraph build\n```\n\nFiles with the configured extensions are parsed with the named grammar. The\nresulting `Function` and `Class` nodes and `CALLS` and `IMPORTS_FROM` edges go\nthrough every downstream feature (impact radius, search, communities, wiki,\nMCP tools) like built-in languages. Nodes carry the custom language name (here\n`erlang`) in their `language` field.\n"},"source-f7e659f3180fbf97-s3":{"body":"来源：`docs/CUSTOM_LANGUAGES.md:36-54`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Schema reference\n\nEach custom language is one `[languages.\u003cname>]` table.\n\n| Key | Type | Required | Meaning |\n|-----|------|----------|---------|\n| `\u003cname>` | table key | yes | Language identifier stored on every parsed node. A lowercase letter followed by lowercase letters, digits, `_` or `-`; at most 32 characters. |\n| `extensions` | list of strings | yes | File extensions to claim. Each is a dot followed by 1 to 15 characters from `a-z`, `0-9`, `_`, `+`, `-`. Matched case-insensitively. |\n| `grammar` | string | yes | A grammar name shipped by `tree_sitter_language_pack` (see [Troubleshooting](#troubleshooting) for how to check). |\n| `function_node_types` | list of strings | no* | Node types that define functions or methods. Each becomes a `Function` node, or a `Test` node when its name or location marks it as a test. |\n| `class_node_types` | list of strings | no* | Node types that define classes, records or types. Each becomes a `Class` node. |\n| `import_node_types` | list of strings | no* | Node types for import or include statements. Each yields an `IMPORTS_FROM` edge. |\n| `call_node_types` | list of strings | no* | Node types for call expressions. Each yields a `CALLS` edge from the enclosing function. |\n| `name_field` | string or list of strings | no | Ordered candidates for finding a definition's name when it is not in a `name` field or an identifier child (see below). At most 8. |\n| `comment` | string | no | Free text for humans; ignored by the parser. |\n\n\\* At least one of the four node-type lists must be non-empty, otherwise the\nentry is skipped.\n"},"source-f7e659f3180fbf97-s4":{ (`identifier`, `word`, `name`, `type_identifier`, ...) or, failing that, its own\ntext. Surrounding braces, quotes and whitespace are stripped. Text that is\nempty, spans lines or is longer than 256 characters is rejected. If no\ncandidate resolves, the `name` field fallback above applies.\n\n```toml\n[languages.bibtex]\nextensions = [\".bib\"]\ngrammar = \"bibtex\"\nclass_node_types = [\"entry\"]\nname_field = [\"key\"]            # @article{smith2020,...} -> \"smith2020\"\n\n[languages.latex]\nextensions = [\".tex\"]\ngrammar = \"latex\"\nclass_node_types = [\"section\", \"chapter\", \"subsection\"]\nfunction_node_types = [\"new_command_definition\"]\nname_field = [\"name\", \"text\", \"declaration\"]\n#   \\section{Introduction}   -> \"Introduction\" (via `text`)\n#   \\newcommand{\\foo}{bar}    -> \"\\foo\"        (via `declaration`)\n\n[languages.markdown]\nextensions = [\".md\"]\ngrammar = \"markdown\"\nclass_node_types = [\"section\"]\nname_field = [\"inline\"]         # \"# My Heading\" -> \"My Heading\" (typed descendant)\n```\n\nUse a list when node types keep their names in different places (LaTeX\n`section` uses `text`, `\\newcommand` uses `declaration`): the first candidate\nthat resolves wins.\n"},"source-f7e659f3180fbf97-s6":{"body":"来源：`docs/CUSTOM_LANGUAGES.md:121-153`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Finding the right node type names\n\nNode type names are grammar-specific. Two ways to see them:\n\n**Tree-sitter playground.** Paste a snippet into\n\u003chttps://tree-sitter.github.io/tree-sitter/7-playground.html>, select the\ngrammar, and read the node names off the tree.\n\n**Probe locally.** The grammar version your build uses is the one in\n`tree_sitter_language_pack`, so this is the reliable source:\n\n```bash\npython - \u003c\u003c'EOP'\nimport tree_sitter_language_pack as tslp\n\nsource = b\"\"\"\n-module(math_utils).\nadd(A, B) -> helper(A) + B.\nhelper(X) -> X * 2.\n\"\"\"\n\ndef dump(node, depth=0):\n    print(\"  \" * depth + node.type, node.text.decode()[:40].replace(\"\\n\", \" \"))\n    for child in node.children:\n        dump(child, depth + 1)\n\ndump(tslp.get_parser(\"erlang\").parse(source).root_node)\nEOP\n```\n\nPick node types that wrap whole definitions (`function_clause`, not the inner\n`atom`) and whole call expressions (`call`, not the callee identifier).\n"},"source-f7e659f3180fbf97-s7":{"body":"来源：`docs/CUSTOM_LANGUAGES.md:154-183`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Worked example: Erlang end to end\n\n`src/math_utils.erl`:\n\n```erlang\n-module(math_utils).\n-export([add/2, scale/2]).\n-import(lists, [map/2]).\n\n-record(point, {x, y}).\n\nadd(A, B) ->\n    helper(A) + B.\n\nhelper(X) -> X * 2.\n\nscale(Points, F) ->\n    lists:map(fun(P) -> add(P, F) end, Points).\n```\n\nWith the `[languages.erlang]` config from the quick start, a build produces:\n\n- `Function` nodes `add`, `helper`, `scale` (from `function_clause`), each\n  with `language = \"erlang\"`.\n- A `Class` node `point` (from `record_decl`).\n- `CALLS` edges `add -> helper` and `scale -> add`, resolved to their\n  same-file qualified names, plus `scale -> lists:map` for the remote call.\n- An `IMPORTS_FROM` edge targeting `lists` (from `import_attribute`).\n- `CONTAINS` edges from the file to every definition.\n"},"source-f7e659f3180fbf97-s8":{"body":"来源：`docs/CUSTOM_LANGUAGES.md:184-207`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## How extraction works (and its limits)\n\nCustom languages go through the same generic tree-sitter walker as built-in\nlanguages. There is no per-language code path, which keeps the feature simple\nand sets its limits:\n\n- Names come from `name_field`, then the grammar's `name` field, then an\n  identifier-like child (see above). Definitions with no resolvable name are\n  dropped.\n- Callees are read from the call node's `function`, `callee`, `expr` or `name`\n  field, in that order, descending through nested applications of the same\n  field (curried calls). Callee text that spans lines or exceeds 256 characters\n  is dropped. Other call shapes are missed.\n- Import targets come from the statement's `module`, `name`, `path` or `source`\n  field; otherwise the whole statement text is recorded.\n- No cross-file module resolution. Import edges keep the module name as written\n  (`lists`); they are not resolved to file paths as built-in languages with\n  dedicated resolvers are.\n- No language-specific extras: decorator-based test detection, framework\n  annotations (Spring, Temporal) and SFC handling exist only for built-in\n  languages.\n\nIf a language needs more than the generic walker gives, open an issue.\n"},"source-f7e659f3180fbf97-s9":{"body":"来源：`docs/CUSTOM_LANGUAGES.md:208-218`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Troubleshooting\n\n- The loader logs a `WARNING` for every skipped entry, naming the config file,\n  the language and the reason. The CLI prints log lines to stderr during\n  `build` and `update`; `-q` does not hide warnings.\n- Check a grammar is bundled:\n  `python -c \"import tree_sitter_language_pack as t; t.get_language('erlang')\"`.\n  It raises `LookupError` if it is not.\n- The config is read when a parser is constructed and cached by file mtime and\n  size. `update` re-parses only changed files, so run `reviewgraph build`\n  after editing the config to apply it to every file."},"folder:reference:modules":{"body":"# modules\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:modules/code-review":{"body":"# modules/code-review\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:modules/code-review/graph_engine":{"body":"# modules/code-review/graph_engine\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:modules/code-review/graph_engine/docs":{"body":"# modules/code-review/graph_engine/docs\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-b3de1829c6b387d4":{"body":"# modules/code-review/graph_engine/docs/LLM-OPTIMIZED-REFERENCE.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：CLAUDE.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# LLM-OPTIMIZED REFERENCE: reviewgraph\n\nAgents: fetch one section at a time with get_docs_section_tool(section_name=\"...\"). Do not load the whole file.\n\n\u003csection name=\"usage\">\nInstall: pip install reviewgraph, then reviewgraph install && reviewgraph build.\nFirst call in any task: get_minimal_context_tool(task=\"\u003ctask>\"). About 100 tokens: summary, risk, communities, flows_affected, next_tool_suggestions. status: not_ready means call build_or_update_graph_tool first.\nPass detail_level=\"minimal\" wherever a tool accepts it; use \"standard\" only when minimal is not enough.\nPrefer a targeted query_graph_tool call over a broad listing tool.\nBudget: about five tool calls and 800 tokens of graph output per task.\ncontext_savings, when present, is an estimate, not an exact token count.\n\u003c/section>\n\n\u003csection name=\"review-delta\">\n1. get_minimal_context_tool(task=\"review changes\"); build_or_update_graph_tool() if not_ready.\n2. detect_changes_tool(detail_level=\"minimal\") for risk-scored changed functions, test gaps and affected flows.\n3. get_review_context_tool(detail_level=\"minimal\") when you need source snippets and review_guidance.\n4. query_graph_tool(pattern=\"tests_for\", target=\"\u003cfunction>\") for each untested high-risk function.\nUse detail_level=\"standard\" only for high-risk items. Report summary, risk, issues, blast radius, recommendations.\n\u003c/section>\n\n\u003csection name=\"review-pr\">\n1. get_minimal_context_tool(task=\"review PR\", base=\"main\"); build_or_update_graph_tool() if not_ready.\n2. detect_changes_tool(base=\"main\", detail_level=\"minimal\"); get_affected_flows_tool(base=\"main\", detail_level=\"minimal\") when you need flow steps.\n3. query_graph_tool with callers_of and tests_for for high-risk functions.\nReport a structured review with a blast-radius table and risk scores. Do not include whole files unless asked.\n\u003c/section>\n\n\u003csection name=\"reviewgraph\">\nMCP tools (30): build_or_update_graph_tool, run_postprocess_tool, get_minimal_context_tool, get_impact_radius_tool, query_graph_tool, get_review_context_tool, semantic_search_nodes_tool, embed_graph_tool, list_graph_stats_tool, get_docs_section_tool, find_large_functions_tool, list_flows_tool, get_flow_tool, get_affected_flows_tool, list_communities_tool, get_community_tool, get_architecture_overview_tool, detect_changes_tool, refactor_tool, apply_refactor_tool, generate_wiki_tool, get_wiki_page_tool, get_hub_nodes_tool, get_bridge_nodes_tool, get_knowledge_gaps_tool, get_surprising_connections_tool, get_suggested_questions_tool, traverse_graph_tool, list_repos_tool, cross_repo_search_tool.\nquery_graph_tool patterns: callers_of, references_to, callees_of, imports_of, importers_of, children_of, tests_for, inheritors_of, triggers_of, triggered_by, publishers_of, listeners_of, handlers_of, endpoints_for, consumers_of, file_summary.\nrefactor_tool modes: rename (old_name, new_name; apply with apply_refactor_tool(refactor_id)), dead_code, suggest.\nMCP prompts (5): review_changes, architecture_map, debug_issue, onboard_developer, pre_merge_check.\nSkills: build-graph, debug-issue, explore-codebase, refactor-safely, review-changes, review-delta, review-pr.\nCLI: reviewgraph {install, init, uninstall, build, update, postprocess, embed, watch, status, forget, visualize, wiki, register, unregister, repos, eval, detect-changes, enrich, dead-code, query, impact, search, flows, flow, communities, community, architecture, large-functions, refactor, serve, mcp, daemon}. Run reviewgraph \u003ccommand> --help for flags.\nResult bounds: lists are capped. Defaults are small; pass the tool's cap parameter to widen up to its hard ceiling. Truncation is reported: total (or a *_total field per list) gives the full count, truncated is true, and the summary says how many of how many are shown.\nCap parameters: max_results (query_graph, get_review_context, detect_changes, list_communities, get_architecture_overview, refactor, cross_repo_search); max_flows (get_affected_flows, detect_changes); max_members (list_communities, get_community, get_architecture_overview); max_steps and max_source_lines (get_flow); max_per_category (get_knowledge_gaps); top_n (get_hub_nodes, get_bridge_nodes, get_surprising_connections); limit (list_flows, semantic_search_nodes, find_large_functions, cross_repo_search); max_files (get_review_context); max_chars (get_wiki_page); max_diff_files (apply_refactor).\nCaps reject values below 1 and booleans. get_affected_flows treats max_flows=0 as no caller limit, still capped at 25 flows in standard mode or 500 in minimal, with a shared 400-step budget (#849).\n\u003c/section>\n\n\u003csection name=\"legal\">\nMIT licence. Graph build and review run locally; no telemetry. Database: .reviewgraph/graph.db. Cloud embedding providers (openai, google, minimax, voyage) send node names, docstrings and file paths to that provider only when you select them; a stderr warning is printed unless CRG_ACCEPT_CLOUD_EMBEDDINGS=1.\n\u003c/section>\n\n\u003csection name=\"watch\">\nreviewgraph watch updates the graph on file save (watchdog).\nreviewgraph install adds hooks instead: PostToolUse on Edit|Write runs update (event names vary by platform), SessionStart runs status, and a git pre-commit hook runs update.\n\u003c/section>\n\n\u003csection name=\"embeddings\">\nLocal provider: pip install \"reviewgraph[embeddings]\"; default model all-MiniLM-L6-v2, override with CRG_EMBEDDING_MODEL.\nCloud providers, selected with embed_graph_tool(provider=...): openai needs CRG_OPENAI_BASE_URL, CRG_OPENAI_API_KEY and CRG_OPENAI_MODEL (any OpenAI-compatible endpoint); google needs GOOGLE_API_KEY and pip install \"reviewgraph[google-embeddings]\"; minimax needs MINIMAX_API_KEY; voyage needs VOYAGE_API_KEY, model from CRG_VOYAGE_MODEL or voyage-code-3.\nRun embed_graph_tool once; changing model or provider re-embeds every node. semantic_search_nodes_tool uses vectors when they exist for the chosen provider, otherwise FTS5 keyword search.\n\u003c/section>\n\n\u003csection name=\"languages\">\nTree-sitter (tree-sitter-language-pack): Python, JavaScript, TypeScript, TSX, Go, Rust, Java, C, C++, C#, VB.NET, Ruby, Kotlin, Swift, PHP, Scala, Solidity, Dart, R, Perl, Lua, Luau, Objective-C, Bash and Zsh, Elixir, Zig, PowerShell, Julia, ReScript, GDScript, Nix, Verilog and SystemVerilog, SQL, HCL (Terraform .tf and .hcl).\nTargeted parsers: Vue and Svelte single-file components, Astro (through the TypeScript parser), Jupyter and Databricks notebooks, Perl XS (parsed as C), Ansible playbooks, roles and tasks, Spring configuration (.properties and YAML). Other YAML is not parsed.\nCustom languages: .reviewgraph/languages.toml (extensions and node types per grammar), see docs/CUSTOM_LANGUAGES.md. Built-in extensions and language names cannot be overridden.\n\u003c/section>\n\n\u003csection name=\"troubleshooting\">\nLocked database: SQLite runs in WAL mode with a 5 s busy timeout and recovers on its own. Run one build at a time.\nLarge repos: a cold build of about 3,000 files takes about 40 s; an incremental update on the hook path about 2.5 s (docs/REPRODUCING.md). Add patterns to .reviewgraphignore to skip generated code.\nStale graph: reviewgraph update, or build_or_update_graph_tool(full_rebuild=True) when nodes are missing.\nMissing nodes: check the languages section and your ignore patterns.\nWindows and WSL: use forward slashes in repo_root; in WSL install uv inside WSL and use WSL2 for file watching.\n\u003c/section>\n\nAgents: for any question about reviewgraph usage, commands or workflows, call get_docs_section_tool with the section name and answer from that section plus the current graph state only."},"source-b3de1829c6b387d4-s1":{"body":"来源：`modules/code-review/graph_engine/docs/LLM-OPTIMIZED-REFERENCE.md:1-70`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# LLM-OPTIMIZED REFERENCE: reviewgraph\n\nAgents: fetch one section at a time with get_docs_section_tool(section_name=\"...\"). Do not load the whole file.\n\n\u003csection name=\"usage\">\nInstall: pip install reviewgraph, then reviewgraph install && reviewgraph build.\nFirst call in any task: get_minimal_context_tool(task=\"\u003ctask>\"). About 100 tokens: summary, risk, communities, flows_affected, next_tool_suggestions. status: not_ready means call build_or_update_graph_tool first.\nPass detail_level=\"minimal\" wherever a tool accepts it; use \"standard\" only when minimal is not enough.\nPrefer a targeted query_graph_tool call over a broad listing tool.\nBudget: about five tool calls and 800 tokens of graph output per task.\ncontext_savings, when present, is an estimate, not an exact token count.\n\u003c/section>\n\n\u003csection name=\"review-delta\">\n1. get_minimal_context_tool(task=\"review changes\"); build_or_update_graph_tool() if not_ready.\n2. detect_changes_tool(detail_level=\"minimal\") for risk-scored changed functions, test gaps and affected flows.\n3. get_review_context_tool(detail_level=\"minimal\") when you need source snippets and review_guidance.\n4. query_graph_tool(pattern=\"tests_for\", target=\"\u003cfunction>\") for each untested high-risk function.\nUse detail_level=\"standard\" only for high-risk items. Report summary, risk, issues, blast radius, recommendations.\n\u003c/section>\n\n\u003csection name=\"review-pr\">\n1. get_minimal_context_tool(task=\"review PR\", base=\"main\"); build_or_update_graph_tool() if not_ready.\n2. detect_changes_tool(base=\"main\", detail_level=\"minimal\"); get_affected_flows_tool(base=\"main\", detail_level=\"minimal\") when you need flow steps.\n3. query_graph_tool with callers_of and tests_for for high-risk functions.\nReport a structured review with a blast-radius table and risk scores. Do not include whole files unless asked.\n\u003c/section>\n\n\u003csection name=\"reviewgraph\">\nMCP tools (30): build_or_update_graph_tool, run_postprocess_tool, get_minimal_context_tool, get_impact_radius_tool, query_graph_tool, get_review_context_tool, semantic_search_nodes_tool, embed_graph_tool, list_graph_stats_tool, get_docs_section_tool, find_large_functions_tool, list_flows_tool, get_flow_tool, get_affected_flows_tool, list_communities_tool, get_community_tool, get_architecture_overview_tool, detect_changes_tool, refactor_tool, apply_refactor_tool, generate_wiki_tool, get_wiki_page_tool, get_hub_nodes_tool, get_bridge_nodes_tool, get_knowledge_gaps_tool, get_surprising_connections_tool, get_suggested_questions_tool, traverse_graph_tool, list_repos_tool, cross_repo_search_tool.\nquery_graph_tool patterns: callers_of, references_to, callees_of, imports_of, importers_of, children_of, tests_for, inheritors_of, triggers_of, triggered_by, publishers_of, listeners_of, handlers_of, endpoints_for, consumers_of, file_summary.\nrefactor_tool modes: rename (old_name, new_name; apply with apply_refactor_tool(refactor_id)), dead_code, suggest.\nMCP prompts (5): review_changes, architecture_map, debug_issue, onboard_developer, pre_merge_check.\nSkills: build-graph, debug-issue, explore-codebase, refactor-safely, review-changes, review-delta, review-pr.\nCLI: reviewgraph {install, init, uninstall, build, update, postprocess, embed, watch, status, forget, visualize, wiki, register, unregister, repos, eval, detect-changes, enrich, dead-code, query, impact, search, flows, flow, communities, community, architecture, large-functions, refactor, serve, mcp, daemon}. Run reviewgraph \u003ccommand> --help for flags.\nResult bounds: lists are capped. Defaults are small; pass the tool's cap parameter to widen up to its hard ceiling. Truncation is reported: total (or a *_total field per list) gives the full count, truncated is true, and the summary says how many of how many are shown.\nCap parameters: max_results (query_graph, get_review_context, detect_changes, list_communities, get_architecture_overview, refactor, cross_repo_search); max_flows (get_affected_flows, detect_changes); max_members (list_communities, get_community, get_architecture_overview); max_steps and max_source_lines (get_flow); max_per_category (get_knowledge_gaps); top_n (get_hub_nodes, get_bridge_nodes, get_surprising_connections); limit (list_flows, semantic_search_nodes, find_large_functions, cross_repo_search); max_files (get_review_context); max_chars (get_wiki_page); max_diff_files (apply_refactor).\nCaps reject values below 1 and booleans. get_affected_flows treats max_flows=0 as no caller limit, still capped at 25 flows in standard mode or 500 in minimal, with a shared 400-step budget (#849).\n\u003c/section>\n\n\u003csection name=\"legal\">\nMIT licence. Graph build and review run locally; no telemetry. Database: .reviewgraph/graph.db. Cloud embedding providers (openai, google, minimax, voyage) send node names, docstrings and file paths to that provider only when you select them; a stderr warning is printed unless CRG_ACCEPT_CLOUD_EMBEDDINGS=1.\n\u003c/section>\n\n\u003csection name=\"watch\">\nreviewgraph watch updates the graph on file save (watchdog).\nreviewgraph install adds hooks instead: PostToolUse on Edit|Write runs update (event names vary by platform), SessionStart runs status, and a git pre-commit hook runs update.\n\u003c/section>\n\n\u003csection name=\"embeddings\">\nLocal provider: pip install \"reviewgraph[embeddings]\"; default model all-MiniLM-L6-v2, override with CRG_EMBEDDING_MODEL.\nCloud providers, selected with embed_graph_tool(provider=...): openai needs CRG_OPENAI_BASE_URL, CRG_OPENAI_API_KEY and CRG_OPENAI_MODEL (any OpenAI-compatible endpoint); google needs GOOGLE_API_KEY and pip install \"reviewgraph[google-embeddings]\"; minimax needs MINIMAX_API_KEY; voyage needs VOYAGE_API_KEY, model from CRG_VOYAGE_MODEL or voyage-code-3.\nRun embed_graph_tool once; changing model or provider re-embeds every node. semantic_search_nodes_tool uses vectors when they exist for the chosen provider, otherwise FTS5 keyword search.\n\u003c/section>\n\n\u003csection name=\"languages\">\nTree-sitter (tree-sitter-language-pack): Python, JavaScript, TypeScript, TSX, Go, Rust, Java, C, C++, C#, VB.NET, Ruby, Kotlin, Swift, PHP, Scala, Solidity, Dart, R, Perl, Lua, Luau, Objective-C, Bash and Zsh, Elixir, Zig, PowerShell, Julia, ReScript, GDScript, Nix, Verilog and SystemVerilog, SQL, HCL (Terraform .tf and .hcl).\nTargeted parsers: Vue and Svelte single-file components, Astro (through the TypeScript parser), Jupyter and Databricks notebooks, Perl XS (parsed as C), Ansible playbooks, roles and tasks, Spring configuration (.properties and YAML). Other YAML is not parsed.\nCustom languages: .reviewgraph/languages.toml (extensions and node types per grammar), see docs/CUSTOM_LANGUAGES.md. Built-in extensions and language names cannot be overridden.\n\u003c/section>\n\n\u003csection name=\"troubleshooting\">\nLocked database: SQLite runs in WAL mode with a 5 s busy timeout and recovers on its own. Run one build at a time.\nLarge repos: a cold build of about 3,000 files takes about 40 s; an incremental update on the hook path about 2.5 s (docs/REPRODUCING.md). Add patterns to .reviewgraphignore to skip generated code.\nStale graph: reviewgraph update, or build_or_update_graph_tool(full_rebuild=True) when nodes are missing.\nMissing nodes: check the languages section and your ignore patterns.\nWindows and WSL: use forward slashes in repo_root; in WSL install uv inside WSL and use WSL2 for file watching.\n\u003c/section>\n\nAgents: for any question about reviewgraph usage, commands or workflows, call get_docs_section_tool with the section name and answer from that section plus the current graph state only."},"report-checks-and-files":{"body":"# Report changed files and checks\n\nState the files changed and checks actually run. A missing or blocked check must remain explicit.\n\n## 适用条件\n\nBefore handing off repository changes\n\n适用性：conditional\n\n## 原文\n\n- Before handoff, run relevant quality checks and report changed files and validation results.\n\n## 验证计划\n\nInspect the final diff and report command results without claiming unrun checks passed.\n\n尚未验证实现；规则适用性不等于合规结果。"},"preserve-git-state":{"body":"# Preserve Git state unless authorized\n\nDocumentation cleanup does not authorize branch, commit, push, merge or tracker-sync operations.\n\n## 适用条件\n\nWhen cleanup touches repository history or remote state\n\n适用性：conditional\n\n## 原文\n\n- Do not create branches, commit, push, merge, or sync IssueGraph remotes unless the user explicitly asks. When asked for a PR, target `main`.\n\n## 验证计划\n\nCheck Git status and ensure cleanup does not change repository history or remote state.\n\n尚未验证实现；规则适用性不等于合规结果。"}}}</script>
